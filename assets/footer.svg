    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B301" stop-opacity="0.2"/><stop offset="0.5" stop-color="#FFD35C"/><stop offset="1" stop-color="#F5B301" stop-opacity="0.2"/></linearGradient>
    <radialGradient id="spark"><stop offset="0" stop-color="#FFF3C4"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient>
