<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Aalyan Shoukat Khan – Software Engineering Undergraduate</title>
  <desc id="d">Terminal-style banner. A whoami command prints the name Aalyan Shoukat Khan and the title Software Engineering Undergraduate, then cycles through focus areas: Python backend, applied machine learning and REST APIs.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="c0"><rect x="40" y="70" width="0" height="34"><animate attributeName="width" values="0;260" dur="0.9s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="40" y="226" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;0;0.14;0.30;0.34;1" dur="9s" begin="2.6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="226" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;0;0.14;0.30;0.34;1" dur="9s" begin="5.6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="226" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;0;0.14;0.30;0.34;1" dur="9s" begin="8.6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="298" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14V44H1z" fill="#161B22"/>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="30" cy="23" r="7" fill="#FF5F56"/>
  <circle cx="54" cy="23" r="7" fill="#FFBD2E"/>
  <circle cx="78" cy="23" r="7" fill="#27C93F"/>
  <text x="450" y="29" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="16" fill="#8B949E">aalyan@kamra: ~/profile</text>
  <rect x="1" y="1" width="898" height="4" rx="2" fill="url(#glow)"/>

  <!-- faint code backdrop -->
  <g xml:space="preserve" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="15" fill="#38BDF8" fill-opacity="0.22">
    <text x="620" y="96">class Engineer:</text>
    <text x="620" y="120">&#160;&#160;focus = ["python", "apis"]</text>
    <text x="620" y="144">&#160;&#160;learning = ["fastapi"]</text>
    <text x="620" y="168">&#160;&#160;def build(self):</text>
    <text x="620" y="192">&#160;&#160;&#160;&#160;return "working code"</text>
  </g>

  <g font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace">
    <!-- whoami (typed) -->
    <text x="40" y="96" font-size="26" clip-path="url(#c0)"><tspan fill="#7EE787">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>

    <!-- output -->
    <text x="40" y="154" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" opacity="0">Aalyan Shoukat Khan<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/></text>
    <text x="40" y="192" font-size="24" fill="#79C0FF" opacity="0">Software Engineering Undergraduate<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/></text>

    <!-- cycling commands -->
    <text x="40" y="252" font-size="26" clip-path="url(#c1)"><tspan fill="#7EE787">$</tspan><tspan fill="#E6EDF3"> run --focus python_backend</tspan><tspan fill="#38BDF8">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    <text x="40" y="252" font-size="26" clip-path="url(#c2)"><tspan fill="#7EE787">$</tspan><tspan fill="#E6EDF3"> run --focus applied_ml</tspan><tspan fill="#38BDF8">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    <text x="40" y="252" font-size="26" clip-path="url(#c3)"><tspan fill="#7EE787">$</tspan><tspan fill="#E6EDF3"> run --focus rest_apis</tspan><tspan fill="#38BDF8">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
