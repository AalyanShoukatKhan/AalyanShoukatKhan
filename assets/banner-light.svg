<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d">
  <title id="t">Aalyan Shoukat Khan – Software Engineering Undergraduate</title>
  <desc id="d">Banner with the name Aalyan Shoukat Khan, the headline Software Engineering Undergraduate, and a rotating line of focus areas: Python backend development, applied machine learning, REST APIs and databases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#0369A1" stroke-opacity="0.08" stroke-width="1"/></pattern>
  </defs>
  <style>
    .l{opacity:0;animation:cyc 9s infinite}
    .l2{animation-delay:3s}.l3{animation-delay:6s}
    @keyframes cyc{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .n{animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <rect width="900" height="280" rx="14" fill="url(#bg)"/>
  <rect width="900" height="280" rx="14" fill="url(#grid)"/>
  <rect width="900" height="4" fill="#0369A1"/>
  <g stroke="#0369A1" stroke-opacity="0.35" stroke-width="1.5" fill="none"><path d="M700 60L790 110L850 50M790 110L740 190L860 215M740 190L670 150L700 60"/></g>
  <g fill="#0369A1">
    <circle class="n" cx="700" cy="60" r="7"/><circle class="n" cx="790" cy="110" r="10"/><circle class="n" cx="850" cy="50" r="5"/>
    <circle class="n" cx="740" cy="190" r="8"/><circle class="n" cx="860" cy="215" r="6"/><circle class="n" cx="670" cy="150" r="5"/>
  </g>
  <rect x="48" y="34" width="68" height="68" rx="15" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
  <text x="82" y="82" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="30" font-weight="700" fill="#0369A1">AK</text>
  <text x="48" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0B1730">Aalyan Shoukat Khan</text>
  <text x="48" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#1E3A5F">Software Engineering Undergraduate</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#0369A1">
    <text class="l l1" x="48" y="250">Python  ·  Backend Development</text>
    <text class="l l2" x="48" y="250">Applied Machine Learning  ·  AI / ML</text>
    <text class="l l3" x="48" y="250">REST APIs  ·  Databases</text>
  </g>
</svg>
